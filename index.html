<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡讀書規劃與計時器 (每週統計與手動教材版)</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        }
        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        .progress-bg {
            background: #e5e7eb;
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #111827;
            border-radius: 999px;
            transition: width 0.3s;
        }
        input, select {
            outline: none;
        }
        input:focus, select:focus {
            border-color: #111827 !important;
            box-shadow: 0 0 0 2px rgba(17,24,39,0.08);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-950">

<!-- ================= HEADER ================= -->
<header class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold">
                <i class="fa-solid fa-book-open mr-2"></i>
                極簡讀書規劃與計時器
            </h1>
            <div id="current-datetime" class="text-sm text-gray-500 mt-1">
                載入中...
            </div>
        </div>
        <div id="auth-container" class="flex items-center gap-3">
            <button id="login-btn" class="hidden bg-black text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-800">
                <i class="fa-brands fa-google mr-2"></i> Google 登入
            </button>
            <div id="user-info" class="hidden flex items-center gap-3">
                <img id="user-avatar" src="" alt="avatar" class="w-8 h-8 rounded-full">
                <span id="user-name" class="text-sm font-medium"></span>
                <button id="logout-btn" class="text-xs bg-gray-100 px-3 py-1.5 rounded-lg hover:bg-gray-200">登出</button>
            </div>
        </div>
    </div>
</header>

<!-- ================= APP ================= -->
<main id="app" class="max-w-7xl mx-auto px-6 py-6 space-y-6">

    <!-- ================= TIMER ================= -->
    <section class="card p-6">
        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="space-y-3 w-full md:w-auto">
                <h2 class="font-bold text-lg mb-2">
                    <i class="fa-solid fa-stopwatch mr-2"></i> 讀書計時器 (自動紀錄)
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <select id="timer-subject" class="border rounded-lg px-3 py-2">
                        <option value="">請選擇科目</option>
                    </select>
                    <select id="timer-material" class="border rounded-lg px-3 py-2">
                        <option value="">請先選擇科目</option>
                    </select>
                </div>
                <div class="flex items-center gap-3 pt-2">
                    <button id="timer-start" class="bg-black text-white px-6 py-2.5 rounded-lg hover:bg-gray-800 font-medium">開始計時</button>
                    <button id="timer-stop" class="hidden bg-red-600 text-white px-6 py-2.5 rounded-lg hover:bg-red-700 font-medium">停止並儲存紀錄</button>
                </div>
            </div>
            <div class="text-center bg-gray-50 px-8 py-6 rounded-2xl border w-full md:w-auto">
                <div id="timer-display" class="text-5xl font-mono font-bold tracking-wider">00:00:00</div>
                <div id="timer-status" class="text-sm text-gray-500 mt-2">尚未開始計時</div>
            </div>
        </div>
    </section>

    <!-- ================= KPI ================= -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="card p-5">
            <div class="text-sm text-gray-500">科目數</div>
            <div id="kpi-total-subjects" class="text-3xl font-bold mt-2">0</div>
        </div>
        <div class="card p-5">
            <div class="text-sm text-gray-500">已讀總頁數</div>
            <div class="text-3xl font-bold mt-2">
                <span id="kpi-completed-pages-number">0</span>
                <span class="text-lg">頁</span>
            </div>
        </div>
        <div class="card p-5">
            <div class="text-sm text-gray-500">整體平均進度</div>
            <div id="kpi-avg-progress" class="text-3xl font-bold mt-2">0%</div>
        </div>
    </section>

    <!-- ================= MAIN GRID ================= -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- ================= LEFT: SUBJECTS ================= -->
        <div class="space-y-6">
            <!-- 新增科目 -->
            <section class="card p-6">
                <h2 class="font-bold text-lg mb-5">
                    <i class="fa-solid fa-plus mr-2"></i> 新增讀書科目
                </h2>
                <form id="subject-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">科目名稱</label>
                        <input id="sub-name" type="text" placeholder="例如：工程數學" class="w-full border rounded-lg px-3 py-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">考試日期 (選填)</label>
                        <input id="sub-exam-date" type="date" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    
                    <div class="border-t pt-4">
                        <label class="block text-sm font-medium mb-2">初始教材新增方式：</label>
                        <div class="flex gap-4 mb-3">
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="radio" name="add-mode" value="pdf" checked class="mr-2"> 上傳 PDF 檔案
                            </label>
                            <label class="flex items-center text-sm cursor-pointer">
                                <input type="radio" name="add-mode" value="manual" class="mr-2"> 手動輸入名稱與頁數
                            </label>
                        </div>

                        <!-- PDF 上傳區塊 -->
                        <div id="mode-pdf-container" class="space-y-2">
                            <input id="material-files" type="file" accept=".pdf,application/pdf" multiple class="w-full border rounded-lg px-3 py-2 bg-white text-sm">
                            <p class="text-xs text-gray-500">可以一次選擇多份 PDF 檔案。</p>
                        </div>

                        <!-- 手動輸入區塊 -->
                        <div id="mode-manual-container" class="hidden space-y-3 bg-gray-50 p-3 rounded-xl border">
                            <div>
                                <label class="block text-xs font-medium mb-1 text-gray-600">教材名稱</label>
                                <input id=" manual-mat-name" type="text" placeholder="例如：第1章 向量空間" class="w-full border rounded-lg px-3 py-1.5 text-sm bg-white">
                            </div>
                            <div class="flex gap-2 items-center">
                                <div class="flex-1">
                                    <label class="block text-xs font-medium mb-1 text-gray-600">總頁數</label>
                                    <input id="manual-mat-pages" type="number" min="1" placeholder="例如：50" class="w-full border rounded-lg px-3 py-1.5 text-sm bg-white">
                                </div>
                                <div class="pt-5">
                                    <button type="button" id="add-manual-material-btn" class="bg-gray-800 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-black">
                                        加入清單
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="material-preview" class="space-y-2 pt-2"></div>

                    <button type="submit" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800 font-medium">
                        <i class="fa-solid fa-plus mr-2"></i> 建立科目
                    </button>
                </form>
            </section>

            <!-- SUBJECT LIST -->
            <section class="card p-6">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="font-bold text-lg">
                        <i class="fa-solid fa-layer-group mr-2"></i> 我的科目與教材
                    </h2>
                </div>
                <div id="subject-list" class="space-y-4">
                    <div class="text-center text-gray-400 py-8">尚未建立科目</div>
                </div>
            </section>
        </div>

        <!-- ================= RIGHT: REPORTS & HISTORY ================= -->
        <div class="space-y-6">
            <!-- 每週統整報告 -->
            <section class="card p-6">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="font-bold text-lg">
                        <i class="fa-solid fa-chart-pie mr-2"></i> 每週讀書統整報告
                    </h2>
                    <div id="current-week-label" class="text-xs bg-gray-100 px-3 py-1.5 rounded-lg text-gray-600 font-medium"></div>
                </div>
                <div id="weekly-report-content" class="space-y-4">
                    <div class="text-center text-gray-400 py-6">本週尚無讀書計時紀錄</div>
                </div>
            </section>

            <!-- 每日詳細紀錄 (以星期為主) -->
            <section class="card p-6">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="font-bold text-lg">
                        <i class="fa-solid fa-calendar-days mr-2"></i> 每日計時與閱讀紀錄
                    </h2>
                    <button id="export-csv" class="bg-gray-100 px-3 py-2 rounded-lg text-sm hover:bg-gray-200">
                        <i class="fa-solid fa-download mr-1"></i> 匯出 CSV
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b text-left text-gray-500">
                                <th class="py-3 pr-3">星期 / 日期</th>
                                <th class="py-3 pr-3">科目 / 教材</th>
                                <th class="py-3 pr-3">計時時間 (精確到秒)</th>
                                <th class="py-3">操作</th>
                            </tr>
                        </thead>
                        <tbody id="schedule-list"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</main>

<!-- Modal: 針對既有科目手動加教材的彈窗或區塊 -->
<div id="modal-add-manual" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full space-y-4 shadow-xl">
        <h3 class="font-bold text-lg"><i class="fa-solid fa-pen-to-square mr-2"></i> 手動新增教材</h3>
        <div>
            <label class="block text-xs font-medium mb-1 text-gray-600">教材名稱</label>
            <input id="modal-mat-name" type="text" placeholder="例如：筆記講義" class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-xs font-medium mb-1 text-gray-600">總頁數</label>
            <input id="modal-mat-pages" type="number" min="1" placeholder="例如：30" class="w-full border rounded-lg px-3 py-2 text-sm">
        </div>
        <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="modal-cancel-btn" class="px-4 py-2 bg-gray-100 rounded-lg text-sm hover:bg-gray-200">取消</button>
            <button type="button" id="modal-confirm-btn" class="px-4 py-2 bg-black text-white rounded-lg text-sm hover:bg-gray-800">確認加入</button>
        </div>
    </div>
</div>

<!-- ================= FIREBASE & JAVASCRIPT ================= -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDBv8wQy6iQdyp3TBDXzv5ZPJWsT3PYIXk",
        authDomain: "study-scheduler-21d31.firebaseapp.com",
        projectId: "study-scheduler-21d31",
        storageBucket: "study-scheduler-21d31.firebasestorage.app",
        messagingSenderId: "397621309129",
        appId: "1:397621309129:web:8c2893f7bac4429ff7e718",
        measurementId: "G-LSC7WV46Y9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let userData = { subjects: [], schedules: [] };
    let pendingMaterials = [];
    let currentEditingSubjectId = null;

    // 登入按鈕
    document.getElementById("login-btn").addEventListener("click", async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            console.error("登入失敗", error);
            alert("登入失敗：" + error.message);
        }
    });

    document.getElementById("logout-btn").addEventListener("click", async () => {
        await signOut(auth);
    });

    onAuthStateChanged(auth, async (user) => {
        const loginBtn = document.getElementById("login-btn");
        const userInfo = document.getElementById("user-info");
        
        if (user) {
            currentUser = user;
            loginBtn.classList.add("hidden");
            userInfo.classList.remove("hidden");
            document.getElementById("user-avatar").src = user.photoURL || "";
            document.getElementById("user-name").textContent = user.displayName || user.email;
            await loadUserData();
        } else {
            currentUser = null;
            userInfo.classList.add("hidden");
            loginBtn.classList.remove("hidden");
            userData = { subjects: [], schedules: [] };
            renderApp();
        }
    });

    async function loadUserData() {
        if (!currentUser) return;
        try {
            const docRef = doc(db, "users", currentUser.uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                userData = docSnap.data();
            } else {
                userData = { subjects: [], schedules: [] };
            }
        } catch (e) {
            console.error("載入資料失敗", e);
        }
        renderApp();
    }

    async function saveUserData() {
        if (!currentUser) return;
        try {
            const docRef = doc(db, "users", currentUser.uid);
            await setDoc(docRef, userData);
        } catch (e) {
            console.error("儲存資料失敗", e);
        }
    }

    function makeId() {
        return Date.now() + Math.floor(Math.random() * 1000000);
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function updateDateTime() {
        const now = new Date();
        const text = now.toLocaleString("zh-TW", {
            year: "numeric", month: "2-digit", day: "2-digit",
            weekday: "long", hour: "2-digit", minute: "2-digit", second: "2-digit"
        });
        const dtEl = document.getElementById("current-datetime");
        if (dtEl) dtEl.textContent = text;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // 切換新增教材模式 (PDF 或是 手動)
    const addModeRadios = document.querySelectorAll('input[name="add-mode"]');
    const modePdfContainer = document.getElementById("mode-pdf-container");
    const modeManualContainer = document.getElementById("mode-manual-container");

    addModeRadios.forEach(radio => {
        radio.addEventListener("change", (e) => {
            if (e.target.value === "pdf") {
                modePdfContainer.classList.remove("hidden");
                modeManualContainer.classList.add("hidden");
            } else {
                modePdfContainer.classList.add("hidden");
                modeManualContainer.classList.remove("hidden");
            }
        });
    });

    // 處理上傳 PDF
    const materialFiles = document.getElementById("material-files");
    materialFiles.addEventListener("change", async event => {
        const files = Array.from(event.target.files || []);
        if (files.length === 0) return;

        const preview = document.getElementById("material-preview");
        preview.innerHTML = `<div class="bg-gray-100 rounded-lg p-3 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>正在分析 ${files.length} 份 PDF...</div>`;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) continue;
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                pendingMaterials.push({
                    id: makeId(),
                    fileName: file.name,
                    target: pdf.numPages,
                    current: 0,
                    type: "pdf"
                });
                if (pdf.destroy) await pdf.destroy();
            } catch (error) {
                console.error(error);
            }
        }
        renderPendingMaterials();
    });

    // 處理表單內手動加入教材
    document.getElementById("add-manual-material-btn").addEventListener("click", () => {
        const nameInput = document.getElementById("manual-mat-name");
        const pagesInput = document.getElementById("manual-mat-pages");
        const name = nameInput.value.trim();
        const pages = parseInt(pagesInput.value);

        if (!name) { alert("請輸入教材名稱"); return; }
        if (!pages || pages <= 0) { alert("請輸入有效的頁數"); return; }

        pendingMaterials.push({
            id: makeId(),
            fileName: name,
            target: pages,
            current: 0,
            type: "manual"
        });

        nameInput.value = "";
        pagesInput.value = "";
        renderPendingMaterials();
    });

    function renderPendingMaterials() {
        const container = document.getElementById("material-preview");
        if (pendingMaterials.length === 0) {
            container.innerHTML = "";
            return;
        }
        container.innerHTML = `
            <div class="text-xs font-medium text-gray-600 mb-1">已暫存教材清單：</div>
            ${pendingMaterials.map((m, index) => `
                <div class="flex items-center justify-between border rounded-lg p-2.5 bg-gray-50 text-xs">
                    <div class="truncate mr-2">
                        <i class="fa-solid ${m.type === 'pdf' ? 'fa-file-pdf text-red-500' : 'fa-book text-blue-500'} mr-1"></i>
                        ${escapeHtml(m.fileName)} (${m.target}頁)
                    </div>
                    <button type="button" onclick="removePendingMaterial(${index})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join("")}
        `;
    }

    window.removePendingMaterial = function(index) {
        pendingMaterials.splice(index, 1);
        renderPendingMaterials();
    };

    // 建立科目
    document.getElementById("subject-form").addEventListener("submit", event => {
        event.preventDefault();
        if (!currentUser) { alert("請先登入"); return; }
        const name = document.getElementById("sub-name").value.trim();
        const examDate = document.getElementById("sub-exam-date").value;
        if (!name) return;

        const subject = {
            id: makeId(),
            name,
            examDate: examDate || "",
            materials: [...pendingMaterials]
        };

        userData.subjects.push(subject);
        saveUserData();
        document.getElementById("subject-form").reset();
        pendingMaterials = [];
        renderPendingMaterials();
        modePdfContainer.classList.remove("hidden");
        modeManualContainer.classList.add("hidden");
        document.querySelector('input[name="add-mode"][value="pdf"]').checked = true;
        renderApp();
    });

    // 追加 PDF 到既有科目
    window.addMoreMaterialsToSubject = async function(subjectId, event) {
        const files = Array.from(event.target.files || []);
        if (files.length === 0) return;
        const subject = userData.subjects.find(s => s.id == subjectId);
        if (!subject) return;

        for (let file of files) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                subject.materials.push({
                    id: makeId(),
                    fileName: file.name,
                    target: pdf.numPages,
                    current: 0,
                    type: "pdf"
                });
                if (pdf.destroy) await pdf.destroy();
            } catch (e) { console.error(e); }
        }
        saveUserData();
        renderApp();
        event.target.value = "";
    };

    // 開啟手動新增教材彈窗（針對既有科目）
    window.openModalManualAdd = function(subjectId) {
        currentEditingSubjectId = subjectId;
        document.getElementById("modal-mat-name").value = "";
        document.getElementById("modal-mat-pages").value = "";
        document.getElementById("modal-add-manual").classList.remove("hidden");
    };

    document.getElementById("modal-cancel-btn").addEventListener("click", () => {
        document.getElementById("modal-add-manual").classList.add("hidden");
        currentEditingSubjectId = null;
    });

    document.getElementById("modal-confirm-btn").addEventListener("click", () => {
        if (!currentEditingSubjectId) return;
        const name = document.getElementById("modal-mat-name").value.trim();
        const pages = parseInt(document.getElementById("modal-mat-pages").value);

        if (!name) { alert("請輸入教材名稱"); return; }
        if (!pages || pages <= 0) { alert("請輸入有效頁數"); return; }

        const subject = userData.subjects.find(s => s.id == currentEditingSubjectId);
        if (subject) {
            subject.materials.push({
                id: makeId(),
                fileName: name,
                target: pages,
                current: 0,
                type: "manual"
            });
            saveUserData();
            renderApp();
        }

        document.getElementById("modal-add-manual").classList.add("hidden");
        currentEditingSubjectId = null;
    });

    window.deleteSubject = function(subjectId) {
        if (!confirm("確定要刪除此科目嗎？")) return;
        userData.subjects = userData.subjects.filter(s => s.id != subjectId);
        userData.schedules = userData.schedules.filter(s => s.subjectId != subjectId);
        saveUserData();
        renderApp();
    };

    window.deleteMaterial = function(subjectId, materialId) {
        const subject = userData.subjects.find(s => s.id == subjectId);
        if (!subject) return;
        subject.materials = subject.materials.filter(m => m.id != materialId);
        saveUserData();
        renderApp();
    };

    window.deleteSchedule = function(scheduleId) {
        if (!confirm("確定要刪除這筆紀錄嗎？")) return;
        userData.schedules = userData.schedules.filter(s => s.id != scheduleId);
        saveUserData();
        renderApp();
    };

    // 計時器區塊連動
    const timerSubjectSelect = document.getElementById("timer-subject");
    const timerMaterialSelect = document.getElementById("timer-material");

    timerSubjectSelect.addEventListener("change", () => {
        const subId = timerSubjectSelect.value;
        timerMaterialSelect.innerHTML = '<option value="">請選擇教材</option>';
        if (!subId) return;
        const subject = userData.subjects.find(s => s.id == subId);
        if (subject && subject.materials) {
            subject.materials.forEach(m => {
                const opt = document.createElement("option");
                opt.value = m.id;
                opt.textContent = `${m.fileName} (${m.target}頁)`;
                timerMaterialSelect.appendChild(opt);
            });
        }
    });

    let timerInterval = null;
    let secondsElapsed = 0;
    const timerDisplay = document.getElementById("timer-display");
    const timerStatus = document.getElementById("timer-status");
    const timerStartBtn = document.getElementById("timer-start");
    const timerStopBtn = document.getElementById("timer-stop");

    function formatTime(totalSeconds) {
        const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        return `${hrs}:${mins}:${secs}`;
    }

    timerStartBtn.addEventListener("click", () => {
        const subId = timerSubjectSelect.value;
        const matId = timerMaterialSelect.value;
        if (!subId || !matId) { alert("請先選擇科目與教材再開始計時！"); return; }

        timerStartBtn.classList.add("hidden");
        timerStopBtn.classList.remove("hidden");
        timerSubjectSelect.disabled = true;
        timerMaterialSelect.disabled = true;
        timerStatus.textContent = "計時中...";

        timerInterval = setInterval(() => {
            secondsElapsed++;
            timerDisplay.textContent = formatTime(secondsElapsed);
        }, 1000);
    });

    timerStopBtn.addEventListener("click", () => {
        if (!currentUser) { alert("請先登入"); return; }
        const subId = timerSubjectSelect.value;
        const matId = timerMaterialSelect.value;
        const subject = userData.subjects.find(s => s.id == subId);
        const material = subject?.materials.find(m => m.id == matId);

        if (secondsElapsed > 0 && subject && material) {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            
            const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const weekdayStr = weekdays[now.getDay()];
            const weekNumber = getWeekNumber(now);

            const record = {
                id: makeId(),
                date: dateStr,
                weekday: weekdayStr,
                weekNumber: `${year}-W${weekNumber}`,
                subjectId: subId,
                subjectName: subject.name,
                materialId: matId,
                fileName: material.fileName,
                seconds: secondsElapsed,
                timeFormatted: formatTime(secondsElapsed)
            };

            userData.schedules.push(record);
            saveUserData();
            alert(`已成功儲存！本次計時：${formatTime(secondsElapsed)}`);
        }

        clearInterval(timerInterval);
        secondsElapsed = 0;
        timerDisplay.textContent = "00:00:00";
        timerStartBtn.classList.remove("hidden");
        timerStopBtn.classList.add("hidden");
        timerSubjectSelect.disabled = false;
        timerMaterialSelect.disabled = false;
        timerStatus.textContent = "尚未開始計時";
        renderApp();
    });

    function getWeekNumber(d) {
        d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
        var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        return weekNo;
    }

    // CSV 匯出
    document.getElementById("export-csv").addEventListener("click", () => {
        if (userData.schedules.length === 0) { alert("目前沒有紀錄"); return; }
        let csv = "\uFEFF日期,星期,每週標籤,科目,教材,秒數,時間格式\n";
        userData.schedules.forEach(s => {
            csv += `${s.date},${s.weekday},${s.weekNumber},"${s.subjectName}","${s.fileName}",${s.seconds},${s.timeFormatted}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `讀書計時紀錄_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    });

    function renderApp() {
        const currentSubVal = timerSubjectSelect.value;
        timerSubjectSelect.innerHTML = '<option value="">請選擇科目</option>';
        userData.subjects.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.id;
            opt.textContent = s.name;
            timerSubjectSelect.appendChild(opt);
        });
        timerSubjectSelect.value = currentSubVal;

        let totalSubjects = userData.subjects.length;
        let completedPages = 0, totalPages = 0;
        userData.subjects.forEach(s => {
            if (s.materials) {
                s.materials.forEach(m => {
                    completedPages += Number(m.current) || 0;
                    totalPages += Number(m.target) || 0;
                });
            }
        });
        let avgProgress = totalPages > 0 ? Math.round((completedPages / totalPages) * 100) : 0;

        document.getElementById("kpi-total-subjects").textContent = totalSubjects;
        document.getElementById("kpi-completed-pages-number").textContent = completedPages;
        document.getElementById("kpi-avg-progress").textContent = `${avgProgress}%`;

        // 渲染科目清單
        const subListEl = document.getElementById("subject-list");
        if (userData.subjects.length === 0) {
            subListEl.innerHTML = `<div class="text-center text-gray-400 py-8">尚未建立科目</div>`;
        } else {
            subListEl.innerHTML = userData.subjects.map(s => {
                return `
                    <div class="border rounded-xl p-4 bg-white space-y-3">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-base">${escapeHtml(s.name)}</h3>
                                ${s.examDate ? `<div class="text-xs text-gray-500 mt-0.5"><i class="fa-solid fa-calendar mr-1"></i>考試日期：${s.examDate}</div>` : ''}
                            </div>
                            <button onclick="deleteSubject('${s.id}')" class="text-gray-400 hover:text-red-600 text-sm"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <div class="border-t pt-3 space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-medium text-gray-600">教材清單：</span>
                                <div class="flex gap-1.5">
                                    <button onclick="openModalManualAdd('${s.id}')" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md cursor-pointer">
                                        <i class="fa-solid fa-plus mr-1"></i>手動加教材
                                    </button>
                                    <label class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md cursor-pointer">
                                        <i class="fa-solid fa-file-pdf mr-1"></i>加PDF
                                        <input type="file" accept=".pdf,application/pdf" multiple class="hidden" onchange="addMoreMaterialsToSubject('${s.id}', event)">
                                    </label>
                                </div>
                            </div>
                            ${(!s.materials || s.materials.length === 0) ? `<div class="text-xs text-gray-400 py-1">尚未加入教材</div>` : ''}
                            ${(s.materials || []).map(m => `
                                <div class="flex items-center justify-between text-xs bg-gray-50 p-2 rounded-lg">
                                    <div class="truncate mr-2">
                                        <i class="fa-solid ${m.type === 'pdf' ? 'fa-file-pdf text-red-500' : 'fa-book text-blue-500'} mr-1"></i>
                                        ${escapeHtml(m.fileName)} (${m.target}頁)
                                    </div>
                                    <button onclick="deleteMaterial('${s.id}', '${m.id}')" class="text-gray-400 hover:text-red-600"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            `).join("")}
                        </div>
                    </div>
                `;
            }).join("");
        }

        const scheduleListEl = document.getElementById("schedule-list");
        if (userData.schedules.length === 0) {
            scheduleListEl.innerHTML = `<tr><td colspan="4" class="text-center text-gray-400 py-6">尚無計時紀錄</td></tr>`;
        } else {
            const sorted = [...userData.schedules].reverse();
            scheduleListEl.innerHTML = sorted.map(sch => `
                <tr class="border-b">
                    <td class="py-3 pr-3 font-medium">${sch.weekday}<br><span class="text-xs text-gray-400">${sch.date}</span></td>
                    <td class="py-3 pr-3"><span class="font-bold">${escapeHtml(sch.subjectName)}</span><br><span class="text-xs text-gray-500">${escapeHtml(sch.fileName)}</span></td>
                    <td class="py-3 pr-3 font-mono font-semibold text-black">${sch.timeFormatted}</td>
                    <td class="py-3">
                        <button onclick="deleteSchedule('${sch.id}')" class="text-gray-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join("");
        }

        renderWeeklyReport();
    }

    function renderWeeklyReport() {
        const reportEl = document.getElementById("weekly-report-content");
        const weekLabelEl = document.getElementById("current-week-label");
        
        if (userData.schedules.length === 0) {
            reportEl.innerHTML = `<div class="text-center text-gray-400 py-6">本週尚無讀書計時紀錄</div>`;
            weekLabelEl.textContent = "目前無資料";
            return;
        }

        const weeksMap = {};
        userData.schedules.forEach(s => {
            const w = s.weekNumber || "未知週次";
            if (!weeksMap[w]) weeksMap[w] = { totalSec: 0, subjects: {} };
            weeksMap[w].totalSec += s.seconds;
            if (!weeksMap[w].subjects[s.subjectName]) weeksMap[w].subjects[s.subjectName] = 0;
            weeksMap[w].subjects[s.subjectName] += s.seconds;
        });

        const weekKeys = Object.keys(weeksMap).sort().reverse();
        const latestWeek = weekKeys[0];
        weekLabelEl.textContent = `顯示最近週次: ${latestWeek}`;

        let html = "";
        weekKeys.forEach(wKey => {
            const weekData = weeksMap[wKey];
            const totalH = formatTime(weekData.totalSec);
            html += `
                <div class="border rounded-xl p-4 bg-gray-50 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm text-gray-700"><i class="fa-solid fa-calendar-week mr-1"></i> ${wKey} 總計時</span>
                        <span class="font-mono font-bold text-base bg-black text-white px-2.5 py-0.5 rounded">${totalH}</span>
                    </div>
                    <div class="text-xs text-gray-500 space-y-1 pt-1 border-t">
                        <div class="font-medium text-gray-600">各科目投入時間：</div>
                        <div class="flex flex-wrap gap-2 pt-1">
                            ${Object.entries(weekData.subjects).map(([subName, sec]) => `
                                <span class="bg-white border px-2 py-1 rounded-md">
                                    <b>${escapeHtml(subName)}</b>:${formatTime(sec)}
                                </span>
                            `).join("")}
                        </div>
                    </div>
                </div>
            `;
        });
        reportEl.innerHTML = html;
    }
</script>
</body>
</html>
