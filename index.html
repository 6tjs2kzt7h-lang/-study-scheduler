<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDBv8wQy6iQdyp3TBDXzv5ZPJWsT3PYIXk",

    authDomain:
        "study-scheduler-21d31.firebaseapp.com",

    projectId:
        "study-scheduler-21d31",

    storageBucket:
        "study-scheduler-21d31.firebasestorage.app",

    messagingSenderId:
        "397621309129",

    appId:
        "1:397621309129:web:8c2893f7bac4429ff7e718",

    measurementId:
        "G-LSC7WV46Y9"

};



/* =====================================================
   FIREBASE INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const provider =
    new GoogleAuthProvider();



/* =====================================================
   DATA
===================================================== */

let currentUser = null;


let userData = {

    subjects: [],

    schedules: []

};


let pendingMaterials = [];


let currentEditingSubjectId = null;



/* =====================================================
   ID
===================================================== */

function makeId() {

    return Date.now() +
        Math.floor(
            Math.random() * 1000000
        );

}



/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   日期時間
===================================================== */

function updateDateTime() {

    const now =
        new Date();


    const text =
        now.toLocaleString(
            "zh-TW",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                weekday: "long",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );


    const element =
        document.getElementById(
            "current-datetime"
        );


    if (element) {

        element.textContent =
            text;

    }

}


setInterval(
    updateDateTime,
    1000
);


updateDateTime();



/* =====================================================
   整理資料
===================================================== */

function normalizeUserData(data) {

    const result = {

        subjects:
            Array.isArray(
                data?.subjects
            )
                ? data.subjects
                : [],

        schedules:
            Array.isArray(
                data?.schedules
            )
                ? data.schedules
                : []

    };


    result.subjects =
        result.subjects.map(
            subject => {


                if (
                    !Array.isArray(
                        subject.materials
                    )
                ) {

                    subject.materials = [];

                }


                /*
                 * 相容舊版本
                 */

                if (
                    subject.materials.length === 0 &&
                    subject.target
                ) {

                    subject.materials = [

                        {

                            id: makeId(),

                            fileName:
                                subject.fileName ||
                                "教材",

                            target:
                                Number(
                                    subject.target
                                ) || 0,

                            current:
                                Number(
                                    subject.current
                                ) || 0,

                            type: "manual"

                        }

                    ];

                }


                subject.materials =
                    subject.materials.map(
                        material => ({

                            id:
                                material.id ??
                                makeId(),

                            fileName:
                                material.fileName ||
                                "教材",

                            target:
                                Number(
                                    material.target
                                ) || 0,

                            current:
                                Math.min(
                                    Number(
                                        material.current
                                    ) || 0,

                                    Number(
                                        material.target
                                    ) || 0
                                ),

                            type:
                                material.type ||
                                "manual"

                        })
                    );


                return subject;

            }
        );


    return result;

}



/* =====================================================
   FIRESTORE
===================================================== */

async function loadUserData() {

    if (!currentUser) {

        return;

    }


    try {

        /*
         * 注意：
         * 這裡使用 schedules
         * 要和 Firestore Rules 一致
         */

        const docRef =
            doc(
                db,
                "schedules",
                currentUser.uid
            );


        const docSnap =
            await getDoc(
                docRef
            );


        if (
            docSnap.exists()
        ) {

            userData =
                normalizeUserData(
                    docSnap.data()
                );

        } else {

            userData = {

                subjects: [],

                schedules: []

            };

        }


    } catch (error) {

        console.error(
            "載入資料失敗",
            error
        );


        alert(
            "載入資料失敗：\n" +
            error.message
        );

    }


    renderApp();

}



async function saveUserData() {

    if (!currentUser) {

        return false;

    }


    try {

        /*
         * 和 Rules：
         *
         * /schedules/{userId}
         *
         * 完全一致
         */

        const docRef =
            doc(
                db,
                "schedules",
                currentUser.uid
            );


        await setDoc(
            docRef,
            {

                subjects:
                    userData.subjects,

                schedules:
                    userData.schedules

            }
        );


        return true;


    } catch (error) {

        console.error(
            "儲存資料失敗",
            error
        );


        alert(
            "儲存資料失敗：\n" +
            error.message
        );


        return false;

    }

}

document

            try {

const materialFiles =
    document.getElementById(
        "material-files"
    );


materialFiles.addEventListener(
    "change",
    async event => {


        const files =
            Array.from(
                event.target.files || []
            );


        if (
            files.length === 0
        ) {

            return;

        }


        const preview =
            document.getElementById(
                "material-preview"
            );


        preview.innerHTML = `

            <div
                class="bg-gray-100
                       rounded-lg
                       p-3
                       text-sm">

                <i
                    class="fa-solid
                           fa-spinner
                           fa-spin
                           mr-2">
                </i>

                正在分析 ${files.length} 份 PDF...

            </div>

        `;


        for (
            let i = 0;
            i < files.length;
            i++
        ) {


            const file =
                files[i];


            if (
                file.type !==
                    "application/pdf"
                &&
                !file.name
                    .toLowerCase()
                    .endsWith(
                        ".pdf"
                    )
            ) {

                continue;

            }


            try {

                const arrayBuffer =
                    await file.arrayBuffer();


                const pdf =
                    await pdfjsLib
                        .getDocument({
                            data:
                                arrayBuffer
                        })
                        .promise;


                const pageCount =
                    pdf.numPages;


                pendingMaterials.push({

                    id:
                        makeId(),

                    fileName:
                        file.name,

                    target:
                        pageCount,

                    current:
                        0,

                    type:
                        "pdf"

                });


                if (
                    pdf.destroy
                ) {

                    await pdf.destroy();

                }


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    `PDF 讀取失敗：${file.name}`
                );

            }

        }


        renderPendingMaterials();

    }
);

let timerInterval =

function formatTime(
    totalSeconds
) {

    const hrs =
        String(
            Math.floor(
                totalSeconds / 3600
            )
        )
        .padStart(
            2,
            "0"
        );


    const mins =
        String(
            Math.floor(
                (totalSeconds % 3600) / 60
            )
        )
        .padStart(
            2,
            "0"
        );


    const secs =
        String(
            totalSeconds % 60
        )
        .padStart(
            2,
            "0"
        );


    return `${hrs}:${mins}:${secs}`;

}

/* 停止 */

timerStopBtn
    .addEventListener(
        "click",
        async () => {


            if (!currentUser) {

                alert(
                    "請先登入"
                );

                return;

            }


            clearInterval(
                timerInterval
            );


            const subjectId =
                timerSubjectSelect.value;


            const materialId =
                timerMaterialSelect.value;


            const subject =
                userData.subjects.find(
                    s =>
                        String(s.id) ===
                        String(subjectId)
                );


            const material =
                subject?.materials.find(
                    m =>
                        String(m.id) ===
                        String(materialId)
                );


            if (
                secondsElapsed > 0 &&
                subject &&
                material
            ) {


                const timerEndTime =
                    new Date();


                const pad =
                    n =>
                        String(n)
                            .padStart(
                                2,
                                "0"
                            );


                const yyyy =
                    timerStartTime
                        .getFullYear();


                const mm =
                    pad(
                        timerStartTime
                            .getMonth() + 1
                    );


                const dd =
                    pad(
                        timerStartTime
                            .getDate()
                    );


                const startTime =
                    `${pad(
                        timerStartTime.getHours()
                    )}:${pad(
                        timerStartTime.getMinutes()
                    )}`;


                const endTime =
                    `${pad(
                        timerEndTime.getHours()
                    )}:${pad(
                        timerEndTime.getMinutes()
                    )}`;


                const dateTimeRange =
                    `${yyyy}-${mm}-${dd} ` +
                    `${startTime} ~ ${endTime}`;


                const weekdays = [

                    "星期日",
                    "星期一",
                    "星期二",
                    "星期三",
                    "星期四",
                    "星期五",
                    "星期六"

                ];


                const weekday =
                    weekdays[
                        timerStartTime.getDay()
                    ];


                const weekNumber =
                    getWeekNumber(
                        timerStartTime
                    );


                const startPageInput =
                    document
                        .getElementById(
                            "timer-start-page"
                        )
                        .value;


                const endPageInput =
                    document
                        .getElementById(
                            "timer-end-page"
                        )
                        .value;


                const startPage =
                    startPageInput
                        ? parseInt(
                            startPageInput
                          )
                        : null;


                const endPage =
                    endPageInput
                        ? parseInt(
                            endPageInput
                          )
                        : null;


                let range =
                    "未指定範圍";


                let pagesRead =
                    0;


                if (
                    startPage !== null &&
                    endPage !== null &&
                    endPage >= startPage
                ) {


                    if (
                        endPage >
                        material.target
                    ) {

                        alert(
                            `這份教材只有 ${material.target} 頁。`
                        );

                    } else {

                        range =
                            `第 ${startPage} ~ ${endPage} 頁`;


                        pagesRead =
                            endPage -
                            startPage +
                            1;


                        /*
                         * 不重複計算：
                         * 直接記錄目前最遠讀到哪一頁
                         */

                        material.current =
                            Math.max(
                                Number(
                                    material.current
                                ) || 0,
                                endPage
                            );

                    }

                } else if (
                    endPage !== null &&
                    endPage >= 1
                ) {


                    range =
                        `至第 ${endPage} 頁`;


                    material.current =
                        Math.max(
                            Number(
                                material.current
                            ) || 0,
                            Math.min(
                                endPage,
                                material.target
                            )
                        );

                }



                const record = {

                    id:
                        makeId(),

                    date:
                        `${yyyy}-${mm}-${dd}`,

                    dateTimeRange:
                        dateTimeRange,

                    weekday:
                        weekday,

                    weekNumber:
                        `${yyyy}-W${weekNumber}`,

                    subjectId:
                        subject.id,

                    subjectName:
                        subject.name,

                    materialId:
                        material.id,

                    fileName:
                        material.fileName,

                    range:
                        range,

                    pagesRead:
                        pagesRead,

                    seconds:
                        secondsElapsed,

                    timeFormatted:
                        formatTime(
                            secondsElapsed
                        )

                };


                userData.schedules.push(
                    record
                );


                await saveUserData();


                alert(
                    "已成功儲存！\n\n" +
                    `時間：${dateTimeRange}\n` +
                    `本次計時：${formatTime(
                        secondsElapsed
                    )}`
                );

            }


            secondsElapsed =
                0;


            timerDisplay.textContent =
                "00:00:00";


            timerStartBtn
                .classList
                .remove(
                    "hidden"
                );


            timerStopBtn
                .classList
                .add(
                    "hidden"
                );


            timerSubjectSelect
                .disabled = false;


            timerMaterialSelect
                .disabled = false;


            document
                .getElementById(
                    "timer-start-page"
                )
                .disabled = false;


            document
                .getElementById(
                    "timer-end-page"
                )
                .disabled = false;


            document

                )

            document
                .getElementById(

                )
                .value = "";


            timerStatus.textContent =
                "尚未開始計時";


            renderApp();

        }
    );



/* =====================================================
   WEEK NUMBER
===================================================== */

function getWeekNumber(date) {

    const d =
        new Date(
            Date.UTC(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            )
        );


    d.setUTCDate(
        d.getUTCDate() +
        4 -
        (d.getUTCDay() || 7)
    );


    const yearStart =
        new Date(
            Date.UTC(
                d.getUTCFullYear(),
                0,
                1
            )
        );


    return Math.ceil(
        (
            (
                (d - yearStart) /
                86400000
            ) + 1
        ) / 7
    );

}

        0;


    let totalPages =
        0;


    userData.subjects
        .forEach(
            subject => {


                if (
                    Array.isArray(
                        subject.materials
                    )
                ) {


                    subject.materials
                        .forEach(
                            material => {


                                completedPages +=
                                    Number(
                                        material.current
                                    ) || 0;


                                totalPages +=
                                    Number(
                                        material.target
                                    ) || 0;

                            }
                        );

                }

            }
        );


    const avgProgress =
        totalPages > 0
            ? Math.round(
                completedPages /
                totalPages *
                100
              )
            : 0;


    document
        .getElementById(
            "kpi-total-subjects"
        )
        .textContent =
        userData.subjects.length;


    document
        .getElementById(
            "kpi-completed-pages-number"
        )
        .textContent =
        completedPages;


    document
        .getElementById(
            "kpi-avg-progress"
        )
        .textContent =
        `${avgProgress}%`;



    /* -------------------------
       科目
    ------------------------- */

    renderSubjects();


    /* -------------------------
       紀錄
    ------------------------- */

    renderSchedules();


    /* -------------------------
       Weekly
    ------------------------- */

    renderWeeklyReport();

}

/* =====================================================
   DELETE SCHEDULE
===================================================== */

window.deleteSchedule =
    async function(scheduleId) {


        if (
            !confirm(
                "確定要刪除這筆紀錄嗎？"
            )
        ) {

            return;

        }


        userData.schedules =
            userData.schedules.filter(
                schedule =>
                    String(
                        schedule.id
                    ) !==
                    String(
                        scheduleId
                    )
            );


        await saveUserData();


        renderApp();

    };



/* =====================================================
   WEEKLY REPORT
===================================================== */

function renderWeeklyReport() {


    const report =
        document.getElementById(
            "weekly-report-content"
        );


    const label =
        document.getElementById(
            "current-week-label"
        );


    if (
        userData.schedules.length ===
        0
    ) {

        report.innerHTML = `

            <div
                class="text-center
                       text-gray-400
                       py-6">

                本週尚無讀書計時紀錄

            </div>

        `;


        label.textContent =
            "目前週次";


        return;

    }


    const now =
        new Date();


    const weekKey =
        `${now.getFullYear()}-W${getWeekNumber(now)}`;


    label.textContent =
        `本週：${weekKey}`;


    const schedules =
        userData.schedules.filter(
            schedule =>
                schedule.weekNumber ===
                weekKey
        );


    if (
        schedules.length ===
        0
    ) {

        report.innerHTML = `

            <div
                class="text-center
                       text-gray-400
                       py-6">

                本週尚無計時紀錄

            </div>

        `;

        return;

    }


    let totalSeconds =
        0;


    const summary = {};


    schedules.forEach(
        schedule => {


            const seconds =
                Number(
                    schedule.seconds
                ) || 0;


            totalSeconds +=
                seconds;


            const name =
                schedule.subjectName ||
                "未知科目";


            summary[name] =
                (
                    summary[name] ||
                    0
                ) + seconds;

        }
    );


    report.innerHTML = `

        <div
            class="bg-gray-50
                   p-4
                   rounded-xl
                   border
                   space-y-2">


            <div
                class="text-xs
                       text-gray-500">

                本週總讀書時間

            </div>


            <div
                class="text-2xl
                       font-bold
                       font-mono">

                ${formatTime(
                    totalSeconds
                )}

            </div>

        </div>


        <div class="space-y-2">

            <div
                class="text-xs
                       font-medium
                       text-gray-600">

                各科目投入時間：

            </div>


            ${
                Object.entries(
                    summary
                )
                .map(
                    ([name, seconds]) => `

                        <div
                            class="flex
                                   justify-between
                                   items-center
                                   text-sm
                                   border-b
                                   pb-1.5">


                            <span
                                class="font-medium">

                                ${escapeHtml(
                                    name
                                )}

                            </span>


                            <span
                                class="font-mono
                                       text-gray-600">

                                ${formatTime(
                                    seconds
                                )}

                            </span>

                        </div>

                    `
                )
                .join("")
            }

        </div>

    `;

}
