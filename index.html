<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端多人版 - 自訂讀書排程與計時器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js 用於自動解析 PDF 頁數 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- 頁首控制列 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> 雲端自訂讀書規劃與計時器
            </h1>
            <div class="flex items-center gap-4">
                <!-- 顯示今天日期 -->
                <span id="current-date-display" class="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg hidden sm:inline-block"></span>
                <span id="user-info" class="text-sm text-slate-600 hidden"></span>
                <button id="login-btn" onclick="loginWithGoogle()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-brands fa-google"></i> Google 登入
                </button>
                <button id="logout-btn" onclick="logout()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    登出
                </button>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- 未登入提示 -->
        <div id="login-prompt" class="bg-indigo-50 border border-indigo-100 rounded-2xl p-8 text-center my-12">
            <i class="fa-solid fa-lock text-4xl text-indigo-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">請先登入以開始使用</h2>
            <p class="text-slate-600 mb-6">登入後即可在雲端同步你的讀書進度、自訂排程與即時計時紀錄！</p>
            <button onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-medium shadow-md transition inline-flex items-center gap-2">
                <i class="fa-brands fa-google"></i> 使用 Google 帳號立即登入
            </button>
        </div>

        <!-- 登入後顯示的主內容 -->
        <div id="app-content" class="hidden space-y-6">
            
            <!-- KPI 儀表板與計時器面板 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <!-- 讀書計時專區 -->
                <div class="bg-gradient-to-br from-indigo-900 to-indigo-700 text-white p-5 rounded-2xl shadow-md flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs uppercase tracking-wider text-indigo-200 font-semibold flex items-center gap-1">
                                <i class="fa-solid fa-stopwatch"></i> 專注計時器 (精確到秒)
                            </span>
                            <span id="timer-status" class="text-xs px-2 py-0.5 bg-indigo-800 text-indigo-200 rounded-full">就緒</span>
                        </div>
                        <div id="stopwatch-display" class="text-4xl font-mono font-bold tracking-wider my-3 text-center">00:00:00</div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex gap-2">
                            <select id="timer-subject-select" class="w-full text-xs px-2 py-1.5 rounded-lg bg-indigo-800 text-white border border-indigo-600 outline-none">
                                <option value="">選擇計時科目</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button id="timer-start-btn" onclick="startTimer()" class="w-1/2 bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded-xl text-xs font-bold transition">開始計時</button>
                            <button id="timer-stop-btn" onclick="stopTimer()" disabled class="w-1/2 bg-rose-500 hover:bg-rose-600 text-white py-2 rounded-xl text-xs font-bold transition opacity-50 cursor-not-allowed">結束紀錄</button>
                        </div>
                    </div>
                </div>

                <!-- 統計 KPI 1 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-slate-500 font-medium">總科目數</p>
                        <h3 id="kpi-total-subjects" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 text-xl"><i class="fa-solid fa-book"></i></div>
                </div>

                <!-- 統計 KPI 2 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-slate-500 font-medium">已完成總頁數 / 平均進度</p>
                        <h3 id="kpi-completed-pages" class="text-xl font-bold text-emerald-600 mt-1">0 頁 (<span id="kpi-avg-progress">0%</span>)</h3>
                    </div>
                    <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600 text-xl"><i class="fa-solid fa-check-double"></i></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 左側：科目與檔案管理 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-600"></i> 新增科目與考試設定
                    </h2>
                    <form id="subject-form" class="space-y-3">
                        <input type="text" id="sub-name" placeholder="科目名稱 (例如：有機化學)" required class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        
                        <div class="flex gap-2">
                            <div class="w-1/2">
                                <label class="text-xs text-slate-500 block mb-1">目標頁數 (選填)</label>
                                <input type="number" id="sub-target" placeholder="若有匯入檔可不填" min="1" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div class="w-1/2">
                                <label class="text-xs text-slate-500 block mb-1">考試日期</label>
                                <input type="date" id="sub-exam-date" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-slate-500 block mb-1">匯入參考檔案 (可多選 PDF/文字檔)</label>
                            <input type="file" id="sub-files" multiple accept=".pdf,.txt" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                        </div>

                        <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-2.5 rounded-xl text-sm font-medium transition">建立科目與任務</button>
                    </form>

                    <hr class="border-slate-100 my-4">

                    <h3 class="text-sm font-bold text-slate-700">讀書清單與進度勾選</h3>
                    <div id="subject-list" class="space-y-4 max-h-[400px] overflow-y-auto pr-1">
                        <!-- 動態插入科目 -->
                    </div>
                </div>

                <!-- 右側：自訂排程與計時紀錄 -->
                <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-5">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-calendar-days text-indigo-600"></i> 自訂讀書排程與計時紀錄
                        </h2>
                        <button id="export-csv-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">
                            <i class="fa-solid fa-download"></i> 匯出 CSV
                        </button>
                    </div>

                    <!-- 新增排程表單 -->
                    <form id="schedule-form" class="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
                        <div>
                            <label class="text-xs text-slate-500 block mb-1">選擇日期 / 星期</label>
                            <input type="date" id="sch-date" required class="w-full px-3 py-2 border rounded-xl text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 block mb-1">時段 (例如 19:00-21:00)</label>
                            <input type="text" id="sch-time" placeholder="例如：19:00 - 21:00" required class="w-full px-3 py-2 border rounded-xl text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 block mb-1">選擇讀書科目</label>
                            <select id="sch-subject" onchange="window.updateFileDropdown()" class="w-full px-3 py-2 border rounded-xl text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                                <!-- 動態填入科目 -->
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 block mb-1">選擇對應檔案</label>
                            <select id="sch-file" class="w-full px-3 py-2 border rounded-xl text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="">無特定檔案</option>
                            </select>
                        </div>
                        <div class="sm:col-span-4">
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-sm font-medium transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-plus"></i> 新增排程項目
                            </button>
                        </div>
                    </form>

                    <!-- 排程與計時紀錄表格 -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b text-xs text-slate-400 uppercase">
                                    <th class="py-2 px-3">日期 / 時段</th>
                                    <th class="py-2 px-3">科目與指定檔案</th>
                                    <th class="py-2 px-3">計時與範圍記錄</th>
                                    <th class="py-2 px-3 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="schedule-table-body" class="text-sm divide-y">
                                <!-- 動態排程 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK 引入與邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBv8wQy6iQdyp3TBDXzv5ZPJWsT3PYIXk",
            authDomain: "study-scheduler-21d31.firebaseapp.com",
            projectId: "study-scheduler-21d31",
            storageBucket: "study-scheduler-21d31.firebasestorage.app",
            messagingSenderId: "397621309129",
            appId: "1:397621309129:web:8c2893f7bac4429ff7e718",
            measurementId: "G-LSC7WV46Y9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        auth.useDeviceLanguage();
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let userData = { subjects: [], schedules: [] };

        // 計時器變數
        let timerInterval = null;
        let timerSeconds = 0;
        let activeTimerSession = null;

        // 顯示今天日期
        function displayTodayDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekStr = weekdays[now.getDay()];
            const dateEl = document.getElementById('current-date-display');
            if(dateEl) {
                dateEl.textContent = `今天是：${year}年${month}月${day}日 (星期${weekStr})`;
            }
            
            // 預設排程日期的 input 為今天
            const schDateInput = document.getElementById('sch-date');
            if (schDateInput && !schDateInput.value) {
                const mm = String(month).padStart(2, '0');
                const dd = String(day).padStart(2, '0');
                schDateInput.value = `${year}-${mm}-${dd}`;
            }
        }
        displayTodayDate();

        onAuthStateChanged(auth, async (user) => {
            const loginPrompt = document.getElementById('login-prompt');
            const appContent = document.getElementById('app-content');
            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');

            if (user) {
                currentUser = user;
                if(loginPrompt) loginPrompt.classList.add('hidden');
                if(appContent) appContent.classList.remove('hidden');
                if(loginBtn) loginBtn.classList.add('hidden');
                if(logoutBtn) logoutBtn.classList.remove('hidden');
                if(userInfo) {
                    userInfo.textContent = `Hi, ${user.displayName || user.email}`;
                    userInfo.classList.remove('hidden');
                }
                await loadUserData();
            } else {
                currentUser = null;
                if(loginPrompt) loginPrompt.classList.remove('hidden');
                if(appContent) appContent.classList.add('hidden');
                if(loginBtn) loginBtn.classList.remove('hidden');
                if(logoutBtn) logoutBtn.classList.add('hidden');
                if(userInfo) userInfo.classList.add('hidden');
            }
        });

        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("登入失敗：", error);
                alert("登入失敗：" + error.message);
            }
        };

        window.logout = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("登出失敗：", error);
            }
        };

        async function loadUserData() {
            if (!currentUser) return;
            const docRef = doc(db, "schedules", currentUser.uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                userData = docSnap.data();
                if (!userData.subjects) userData.subjects = [];
                if (!userData.schedules) userData.schedules = [];
            } else {
                const todayStr = new Date().toISOString().split('T')[0];
                userData = {
                    subjects: [
                        { id: 1, name: "微積分", target: 120, current: 40, examDate: "2026-06-15", files: [{ name: "微積分講義.pdf", pages: 120 }] }
                    ],
                    schedules: [
                        { id: 1, date: todayStr, time: "19:00 - 21:00", subjectId: 1, fileName: "微積分講義.pdf", duration: "0小時 0分 0秒", range: "第 40 - 50 頁" }
                    ]
                };
                await saveUserData();
            }
            renderApp();
        }

        async function saveUserData() {
            if (!currentUser) return;
            const docRef = doc(db, "schedules", currentUser.uid);
            await setDoc(docRef, userData);
        }

        // 自動解析 PDF 頁數與檔名
        async function parseFiles(fileList) {
            let filesData = [];
            let extraPages = 0;
            for (let file of fileList) {
                let pageCount = 1; 
                if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        pageCount = pdf.numPages;
                    } catch (e) {
                        console.error("PDF 解析失敗", e);
                    }
                }
                filesData.push({ name: file.name, pages: pageCount });
                extraPages += pageCount;
            }
            return { filesData, extraPages };
        }

        async function addSubjectHandler(e) {
            e.preventDefault();
            const name = document.getElementById('sub-name').value;
            let targetInput = document.getElementById('sub-target').value;
            let target = targetInput ? parseInt(targetInput) : 0;
            const examDate = document.getElementById('sub-exam-date').value;
            const fileInput = document.getElementById('sub-files');

            let files = [];
            if (fileInput.files.length > 0) {
                const parsed = await parseFiles(fileInput.files);
                files = parsed.filesData;
                if (!targetInput) {
                    target = parsed.extraPages;
                }
            }

            if (target <= 0) {
                alert("請至少輸入目標頁數，或上傳能自動解析頁數的檔案！");
                return;
            }

            userData.subjects.push({
                id: Date.now(),
                name,
                target,
                current: 0,
                examDate,
                files
            });

            document.getElementById('subject-form').reset();
            await saveUserData();
            renderApp();
        }

        window.updateProgressDirect = async function(id, val) {
            const sub = userData.subjects.find(s => s.id === id);
            if (sub) {
                sub.current = Math.max(0, Math.min(sub.target, parseInt(val) || 0));
                await saveUserData();
                renderApp();
            }
        }

        window.updateProgress = async function(id, delta) {
            const sub = userData.subjects.find(s => s.id === id);
            if (sub) {
                sub.current = Math.max(0, Math.min(sub.target, sub.current + delta));
                await saveUserData();
                renderApp();
            }
        }

        window.deleteSubject = async function(id) {
            userData.subjects = userData.subjects.filter(s => s.id !== id);
            userData.schedules = userData.schedules.filter(sch => sch.subjectId !== id);
            await saveUserData();
            renderApp();
        }

        // 新增排程項目
        async function addScheduleHandler(e) {
            e.preventDefault();
            const date = document.getElementById('sch-date').value;
            const time = document.getElementById('sch-time').value;
            const subjectId = parseInt(document.getElementById('sch-subject').value);
            const fileName = document.getElementById('sch-file').value;

            if (!subjectId) {
                alert("請先建立並選擇科目！");
                return;
            }

            userData.schedules.push({
                id: Date.now(),
                date,
                time,
                subjectId,
                fileName,
                duration: "未計時",
                range: "尚未填寫"
            });

            document.getElementById('schedule-form').reset();
            displayTodayDate();
            window.updateFileDropdown();
            await saveUserData();
            renderApp();
        }

        window.deleteSchedule = async function(id) {
            userData.schedules = userData.schedules.filter(sch => sch.id !== id);
            await saveUserData();
            renderApp();
        }

        // 隨時更新範圍或計時結果
        window.updateScheduleField = async function(id, field, value) {
            const sch = userData.schedules.find(s => s.id === id);
            if (sch) {
                sch[field] = value;
                await saveUserData();
            }
        }

        // 計時器控制
        window.startTimer = function() {
            const subId = parseInt(document.getElementById('timer-subject-select').value);
            if (!subId) {
                alert("請先選擇要計時的科目！");
                return;
            }
            const sub = userData.subjects.find(s => s.id === subId);
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')} 開始`;

            activeTimerSession = {
                id: Date.now(),
                date: dateStr,
                time: timeStr,
                subjectId: subId,
                fileName: sub.files && sub.files.length > 0 ? sub.files[0].name : '',
                seconds: 0,
                range: "未填寫範圍"
            };

            timerSeconds = 0;
            document.getElementById('timer-status').textContent = `正在計時：${sub.name}`;
            document.getElementById('timer-status').className = "text-xs px-2 py-0.5 bg-emerald-800 text-emerald-200 rounded-full animate-pulse";
            document.getElementById('timer-start-btn').disabled = true;
            document.getElementById('timer-start-btn').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('timer-stop-btn').disabled = false;
            document.getElementById('timer-stop-btn').classList.remove('opacity-50', 'cursor-not-allowed');

            timerInterval = setInterval(() => {
                timerSeconds++;
                activeTimerSession.seconds = timerSeconds;
                const hrs = String(Math.floor(timerSeconds / 3600)).padStart(2, '0');
                const mins = String(Math.floor((timerSeconds % 3600) / 60)).padStart(2, '0');
                const secs = String(timerSeconds % 60).padStart(2, '0');
                document.getElementById('stopwatch-display').textContent = `${hrs}:${mins}:${secs}`;
            }, 1000);
        }

        window.stopTimer = async function() {
            if (!activeTimerSession) return;
            clearInterval(timerInterval);

            const hrs = Math.floor(activeTimerSession.seconds / 3600);
            const mins = Math.floor((activeTimerSession.seconds % 3600) / 60);
            const secs = activeTimerSession.seconds % 60;
            activeTimerSession.duration = `${hrs}小時 ${mins}分 ${secs}秒`;

            // 推入排程清單中
            userData.schedules.unshift(activeTimerSession);

            // 重設計時器 UI
            activeTimerSession = null;
            timerSeconds = 0;
            document.getElementById('stopwatch-display').textContent = "00:00:00";
            document.getElementById('timer-status').textContent = "就緒";
            document.getElementById('timer-status').className = "text-xs px-2 py-0.5 bg-indigo-800 text-indigo-200 rounded-full";
            document.getElementById('timer-start-btn').disabled = false;
            document.getElementById('timer-start-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('timer-stop-btn').disabled = true;
            document.getElementById('timer-stop-btn').classList.add('opacity-50', 'cursor-not-allowed');

            await saveUserData();
            renderApp();
            alert("讀書計時已成功儲存至右側排程紀錄中！您隨時可以在表格中修改讀書範圍。");
        }

        // 強制全局綁定更新檔案下拉選單
        window.updateFileDropdown = function() {
            const subjectSelect = document.getElementById('sch-subject');
            const fileSelect = document.getElementById('sch-file');
            if(!subjectSelect || !fileSelect) return;

            const selectedSubId = parseInt(subjectSelect.value);
            const sub = userData.subjects.find(s => s.id === selectedSubId);
            
            fileSelect.innerHTML = '<option value="">無特定檔案</option>';
            if (sub && sub.files && sub.files.length > 0) {
                sub.files.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.name;
                    opt.textContent = f.name;
                    fileSelect.appendChild(opt);
                });
            }
        }

        function calculateCountdown(examDate) {
            if (!examDate) return null;
            const now = new Date();
            const exam = new Date(examDate);
            const diffTime = exam - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return "已過期";
            if (diffDays === 0) return "就是今天！";
            return `倒數 ${diffDays} 天`;
        }

        function renderApp() {
            const totalSub = userData.subjects.length;
            const totalPages = userData.subjects.reduce((sum, s) => sum + s.current, 0);
            const totalTarget = userData.subjects.reduce((sum, s) => sum + s.target, 0);
            const avgProg = totalTarget > 0 ? Math.round((totalPages / totalTarget) * 100) : 0;

            document.getElementById('kpi-total-subjects').textContent = totalSub;
            document.getElementById('kpi-completed-pages').textContent = `${totalPages} 頁`;
            document.getElementById('kpi-avg-progress').textContent = `${avgProg}%`;

            // 渲染左側科目與計時器下拉
            const listEl = document.getElementById('subject-list');
            const subjectSelect = document.getElementById('sch-subject');
            const timerSubSelect = document.getElementById('timer-subject-select');

            if (userData.subjects.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">目前尚無科目，請從上方新增。</p>`;
                subjectSelect.innerHTML = `<option value="">請先新增科目</option>`;
                timerSubSelect.innerHTML = `<option value="">請先新增科目</option>`;
                document.getElementById('sch-file').innerHTML = `<option value="">無特定檔案</option>`;
            } else {
                const currentSelectedSub = subjectSelect.value;
                const optionsHtml = userData.subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                subjectSelect.innerHTML = optionsHtml;
                timerSubSelect.innerHTML = `<option value="">選擇計時科目</option>` + optionsHtml;
                
                if (currentSelectedSub && userData.subjects.some(s => s.id == currentSelectedSub)) {
                    subjectSelect.value = currentSelectedSub;
                }
                window.updateFileDropdown();

                listEl.innerHTML = userData.subjects.map(s => {
                    const percent = s.target > 0 ? Math.round((s.current / s.target) * 100) : 0;
                    const countdownText = calculateCountdown(s.examDate);
                    
                    let filesHtml = '';
                    if (s.files && s.files.length > 0) {
                        filesHtml = `<div class="text-xs text-indigo-600 bg-indigo-50 p-2.5 rounded-xl space-y-1 border border-indigo-100">
                            <div class="font-bold flex items-center gap-1"><i class="fa-solid fa-paperclip"></i> 已匯入的檔案 (${s.files.length}個)：</div>
                            ${s.files.map(f => `<div class="truncate flex justify-between"><span>📄 ${f.name}</span> <span class="font-semibold text-indigo-700">${f.pages}頁</span></div>`).join('')}
                        </div>`;
                    }

                    return `
                        <div class="p-4 bg-slate-50 rounded-2xl space-y-3 border border-slate-100">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="font-bold text-slate-800 text-base">${s.name}</h4>
                                    ${countdownText ? `<span class="inline-block px-2 py-0.5 bg-amber-50 text-amber-600 text-xs font-semibold rounded-full mt-1"><i class="fa-solid fa-clock"></i> ${countdownText} (${s.examDate})</span>` : ''}
                                </div>
                                <button onclick="deleteSubject(${s.id})" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                            </div>

                            ${filesHtml}

                            <div class="space-y-1">
                                <div class="flex justify-between text-xs text-slate-500">
                                    <span>讀書進度條</span>
                                    <span class="font-bold text-slate-700">${s.current} / ${s.target} 頁 (${percent}%)</span>
                                </div>
                                <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                    <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${percent}%"></div>
                                </div>
                            </div>

                            <div class="flex items-center gap-2 pt-1">
                                <span class="text-xs text-slate-500 whitespace-nowrap">讀到第幾頁：</span>
                                <input type="number" value="${s.current}" min="0" max="${s.target}" onchange="updateProgressDirect(${s.id}, this.value)" class="w-20 px-2 py-1 text-xs border rounded-lg bg-white font-medium text-center focus:ring-2 focus:ring-indigo-500 outline-none">
                                <div class="flex gap-1 ml-auto">
                                    <button onclick="updateProgress(${s.id}, 5)" class="bg-white border hover:bg-slate-100 text-xs px-2 py-1 rounded shadow-sm">+5</button>
                                    <button onclick="updateProgress(${s.id}, 10)" class="bg-white border hover:bg-slate-100 text-xs px-2 py-1 rounded shadow-sm">+10</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // 渲染右側排程與計時紀錄表
            const tbody = document.getElementById('schedule-table-body');
            if (!userData.schedules || userData.schedules.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-400 text-xs">目前尚無排程或計時紀錄，請透過上方表單新增或使用左側計時器。</td></tr>`;
            } else {
                tbody.innerHTML = userData.schedules.map(sch => {
                    const sub = userData.subjects.find(s => s.id === sch.subjectId);
                    const subName = sub ? sub.name : '<span class="text-red-400">科目已刪除</span>';
                    const fileDisplay = sch.fileName ? `<span class="block text-xs text-slate-500 mt-0.5">📄 ${sch.fileName}</span>` : `<span class="block text-xs text-slate-400 mt-0.5">無指定檔案</span>`;

                    return `
                        <tr class="hover:bg-slate-50 border-b">
                            <td class="py-3 px-3">
                                <span class="font-medium text-slate-700 block text-xs">${sch.date || '未指定日期'}</span>
                                <span class="text-xs text-indigo-600 font-semibold">${sch.time}</span>
                            </td>
                            <td class="py-3 px-3">
                                <span class="font-semibold text-slate-800">${subName}</span>
                                ${fileDisplay}
                            </td>
                            <td class="py-3 px-3 space-y-1">
                                <div class="text-xs text-slate-600 font-mono bg-indigo-50 px-2 py-0.5 rounded inline-block">⏱️ ${sch.duration || '0秒'}</div>
                                <div>
                                    <input type="text" value="${sch.range || ''}" placeholder="填寫讀書範圍 (例: p.10-25)" onchange="updateScheduleField(${sch.id}, 'range', this.value)" class="w-full text-xs px-2 py-1 border rounded bg-white outline-none focus:ring-1 focus:ring-indigo-500" title="可隨時填寫或修改實際讀書範圍">
                                </div>
                            </td>
                            <td class="py-3 px-3 text-right">
                                <button onclick="deleteSchedule(${sch.id})" class="text-red-400 hover:text-red-600 text-xs"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        }

        function exportCSV() {
            let csv = '\uFEFF日期,時段,科目,指定檔案,計時長度,讀書範圍\n';
            userData.schedules.forEach(sch => {
                const sub = userData.subjects.find(s => s.id === sch.subjectId);
                csv += `${sch.date || ''},${sch.time},${sub ? sub.name : '未知'},${sch.fileName || '無'},${sch.duration || ''},"${sch.range || ''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'study_timer_records.csv';
            a.click();
        }

        document.getElementById('subject-form').addEventListener('submit', addSubjectHandler);
        document.getElementById('schedule-form').addEventListener('submit', addScheduleHandler);
        document.getElementById('export-csv-btn').addEventListener('click', exportCSV);
    </script>
</body>
</html>
