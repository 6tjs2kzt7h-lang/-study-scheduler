<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡讀書規劃與計時器 (Firebase 登入版)</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        }
        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        .progress-bg {
            background: #e5e7eb;
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #111827;
            border-radius: 999px;
            transition: width 0.3s;
        }
        input, select {
            outline: none;
        }
        input:focus, select:focus {
            border-color: #111827 !important;
            box-shadow: 0 0 0 2px rgba(17,24,39,0.08);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-950">

<!-- ================= HEADER ================= -->
<header class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold">
                <i class="fa-solid fa-book-open mr-2"></i>
                極簡讀書規劃與計時器
            </h1>
            <div id="current-datetime" class="text-sm text-gray-500 mt-1">
                載入中...
            </div>
        </div>
        <div id="auth-container" class="flex items-center gap-3">
            <button id="login-btn" class="hidden bg-black text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-800">
                <i class="fa-brands fa-google mr-2"></i> Google 登入
            </button>
            <div id="user-info" class="hidden flex items-center gap-3">
                <img id="user-avatar" src="" alt="avatar" class="w-8 h-8 rounded-full">
                <span id="user-name" class="text-sm font-medium"></span>
                <button id="logout-btn" class="text-xs bg-gray-100 px-3 py-1.5 rounded-lg hover:bg-gray-200">登出</button>
            </div>
        </div>
    </div>
</header>

<!-- ================= APP ================= -->
<main id="app" class="max-w-7xl mx-auto px-6 py-6">

    <!-- ================= TIMER ================= -->
    <section class="card p-6 mb-6">
        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
                <h2 class="font-bold text-lg mb-2">
                    <i class="fa-solid fa-stopwatch mr-2"></i> 讀書計時器
                </h2>
                <div class="flex items-center gap-3">
                    <select id="timer-subject" class="border rounded-lg px-3 py-2">
                        <option value="">請選擇科目</option>
                    </select>
                    <button id="timer-start" class="bg-black text-white px-5 py-2 rounded-lg hover:bg-gray-800">開始</button>
                    <button id="timer-stop" class="hidden bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700">停止</button>
                </div>
            </div>
            <div class="text-center">
                <div id="timer-display" class="text-5xl font-mono font-bold">00:00:00</div>
                <div id="timer-status" class="text-sm text-gray-500 mt-1">尚未開始</div>
            </div>
        </div>
    </section>

    <!-- ================= KPI ================= -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="card p-5">
            <div class="text-sm text-gray-500">科目數</div>
            <div id="kpi-total-subjects" class="text-3xl font-bold mt-2">0</div>
        </div>
        <div class="card p-5">
            <div class="text-sm text-gray-500">已讀頁數</div>
            <div class="text-3xl font-bold mt-2">
                <span id="kpi-completed-pages-number">0</span>
                <span class="text-lg">頁</span>
            </div>
        </div>
        <div class="card p-5">
            <div class="text-sm text-gray-500">整體平均進度</div>
            <div id="kpi-avg-progress" class="text-3xl font-bold mt-2">0%</div>
        </div>
    </section>

    <!-- ================= MAIN GRID ================= -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- ================= LEFT ================= -->
        <div class="space-y-6">
            <!-- 新增科目 -->
            <section class="card p-6">
                <h2 class="font-bold text-lg mb-5">
                    <i class="fa-solid fa-plus mr-2"></i> 新增讀書科目
                </h2>
                <form id="subject-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">科目名稱</label>
                        <input id="sub-name" type="text" placeholder="例如：工程數學" class="w-full border rounded-lg px-3 py-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">考試日期 (選填)</label>
                        <input id="sub-exam-date" type="date" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">讀書教材 PDF (可選填多份)</label>
                        <input id="material-files" type="file" accept=".pdf,application/pdf" multiple class="w-full border rounded-lg px-3 py-2 bg-white">
                        <p class="text-xs text-gray-500 mt-2">可以一次選擇多份 PDF。建立後也可以隨時再追加。</p>
                    </div>
                    <div id="material-preview" class="space-y-2"></div>
                    <button type="submit" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">
                        <i class="fa-solid fa-plus mr-2"></i> 建立科目
                    </button>
                </form>
            </section>

            <!-- SUBJECT LIST -->
            <section class="card p-6">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="font-bold text-lg">
                        <i class="fa-solid fa-layer-group mr-2"></i> 我的科目
                    </h2>
                </div>
                <div id="subject-list" class="space-y-4">
                    <div class="text-center text-gray-400 py-8">尚未建立科目</div>
                </div>
            </section>
        </div>

        <!-- ================= RIGHT ================= -->
        <div class="space-y-6">
            <!-- 排程 -->
            <section class="card p-6">
                <h2 class="font-bold text-lg mb-5">
                    <i class="fa-solid fa-calendar-check mr-2"></i> 排程與讀書進度
                </h2>
                <form id="schedule-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">日期</label>
                        <input id="schedule-date" type="date" class="w-full border rounded-lg px-3 py-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">時間</label>
                        <input id="schedule-time" type="time" class="w-full border rounded-lg px-3 py-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">科目</label>
                        <select id="schedule-subject" class="w-full border rounded-lg px-3 py-2" required>
                            <option value="">請選擇科目</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">教材</label>
                        <select id="schedule-material" class="w-full border rounded-lg px-3 py-2" required>
                            <option value="">請先選擇科目</option>
                        </select>
                    </div>
                    <div id="reading-info" class="hidden bg-gray-100 rounded-lg p-3 text-sm"></div>
                    <div>
                        <label class="block text-sm font-medium mb-1">開始頁</label>
                        <input id="start-page" type="number" min="1" placeholder="例如：20" class="w-full border rounded-lg px-3 py-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">結束頁</label>
                        <input id="end-page" type="number" min="1" placeholder="例如：35" class="w-full border rounded-lg px-3 py-2" required>
                    </div>
                    <div id="reading-count" class="hidden bg-black text-white rounded-lg p-4">
                        <div class="text-sm opacity-70">本次閱讀</div>
                        <div id="reading-count-number" class="text-2xl font-bold">0 頁</div>
                    </div>
                    <button type="submit" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800">
                        <i class="fa-solid fa-check mr-2"></i> 儲存讀書紀錄
                    </button>
                </form>
            </section>

            <!-- HISTORY -->
            <section class="card p-6">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="font-bold text-lg">
                        <i class="fa-solid fa-clock-rotate-left mr-2"></i> 讀書紀錄
                    </h2>
                    <button id="export-csv" class="bg-gray-100 px-3 py-2 rounded-lg text-sm hover:bg-gray-200">
                        <i class="fa-solid fa-download mr-1"></i> CSV
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b text-left">
                                <th class="py-3 pr-4">日期</th>
                                <th class="py-3 pr-4">科目</th>
                                <th class="py-3 pr-4">教材</th>
                                <th class="py-3 pr-4">閱讀範圍</th>
                                <th class="py-3 pr-4">頁數</th>
                                <th class="py-3">操作</th>
                            </tr>
                        </thead>
                        <tbody id="schedule-list"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</main>

<!-- ================= FIREBASE & JAVASCRIPT ================= -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDBv8wQy6iQdyp3TBDXzv5ZPJWsT3PYIXk",
        authDomain: "study-scheduler-21d31.firebaseapp.com",
        projectId: "study-scheduler-21d31",
        storageBucket: "study-scheduler-21d31.firebasestorage.app",
        messagingSenderId: "397621309129",
        appId: "1:397621309129:web:8c2893f7bac4429ff7e718",
        measurementId: "G-LSC7WV46Y9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let userData = { subjects: [], schedules: [] };
    let pendingMaterials = [];

    // 登入按鈕事件
    document.getElementById("login-btn").addEventListener("click", async () => {
        try {
            await signInWithPopup(auth, provider);
        } catch (error) {
            console.error("登入失敗", error);
            alert("登入失敗：" + error.message);
        }
    });

    // 登出按鈕事件
    document.getElementById("logout-btn").addEventListener("click", async () => {
        await signOut(auth);
    });

    // 監聽登入狀態
    onAuthStateChanged(auth, async (user) => {
        const loginBtn = document.getElementById("login-btn");
        const userInfo = document.getElementById("user-info");
        
        if (user) {
            currentUser = user;
            loginBtn.classList.add("hidden");
            userInfo.classList.remove("hidden");
            document.getElementById("user-avatar").src = user.photoURL || "";
            document.getElementById("user-name").textContent = user.displayName || user.email;

            await loadUserData();
        } else {
            currentUser = null;
            userInfo.classList.add("hidden");
            loginBtn.classList.remove("hidden");
            userData = { subjects: [], schedules: [] };
            renderApp();
        }
    });

    async function loadUserData() {
        if (!currentUser) return;
        try {
            const docRef = doc(db, "users", currentUser.uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                userData = docSnap.data();
            } else {
                userData = { subjects: [], schedules: [] };
            }
        } catch (e) {
            console.error("載入資料失敗", e);
        }
        renderApp();
    }

    async function saveUserData() {
        if (!currentUser) return;
        try {
            const docRef = doc(db, "users", currentUser.uid);
            await setDoc(docRef, userData);
        } catch (e) {
            console.error("儲存資料失敗", e);
        }
    }

    function makeId() {
        return Date.now() + Math.floor(Math.random() * 1000000);
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function updateDateTime() {
        const now = new Date();
        const text = now.toLocaleString("zh-TW", {
            year: "numeric", month: "2-digit", day: "2-digit",
            weekday: "long", hour: "2-digit", minute: "2-digit", second: "2-digit"
        });
        const dtEl = document.getElementById("current-datetime");
        if (dtEl) dtEl.textContent = text;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // 建立新科目時的 PDF 檔案選擇處理
    const materialFiles = document.getElementById("material-files");
    materialFiles.addEventListener("change", async event => {
        const files = Array.from(event.target.files || []);
        pendingMaterials = [];
        renderPendingMaterials();
        if (files.length === 0) return;

        const preview = document.getElementById("material-preview");
        preview.innerHTML = `<div class="bg-gray-100 rounded-lg p-3 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>正在分析 ${files.length} 份 PDF...</div>`;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
                alert(`${file.name} 不是 PDF 檔案`);
                continue;
            }
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const pageCount = pdf.numPages;
                pendingMaterials.push({
                    id: makeId(),
                    fileName: file.name,
                    target: pageCount,
                    current: 0
                });
                if (pdf.destroy) await pdf.destroy();
            } catch (error) {
                console.error(error);
                alert(`無法讀取：${file.name}\n\n請確認 PDF 檔案是否正常。`);
            }
        }
        renderPendingMaterials();
    });

    function renderPendingMaterials() {
        const container = document.getElementById("material-preview");
        if (pendingMaterials.length === 0) {
            container.innerHTML = "";
            return;
        }
        container.innerHTML = `
            <div class="text-sm font-medium mb-2">已選擇教材</div>
            ${pendingMaterials.map((material, index) => `
                <div class="flex items-center justify-between border rounded-lg p-3 bg-gray-50">
                    <div class="min-w-0">
                        <div class="font-medium truncate"><i class="fa-solid fa-file-pdf mr-2"></i>${escapeHtml(material.fileName)}</div>
                        <div class="text-xs text-gray-500 mt-1">共 ${material.target} 頁</div>
                    </div>
                    <button type="button" onclick="removePendingMaterial(${index})" class="text-red-500 hover:text-red-700 ml-3">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join("")}
        `;
    }

    window.removePendingMaterial = function(index) {
        pendingMaterials.splice(index, 1);
        renderPendingMaterials();
    };

    // 建立科目
    document.getElementById("subject-form").addEventListener("submit", event => {
        event.preventDefault();
        if (!currentUser) { alert("請先進行 Google 登入"); return; }
        const name = document.getElementById("sub-name").value.trim();
        const examDate = document.getElementById("sub-exam-date").value;

        if (!name) { alert("請輸入科目名稱"); return; }

        const subject = {
            id: makeId(),
            name,
            examDate: examDate || "",
            materials: pendingMaterials.map(material => ({
                id: material.id,
                fileName: material.fileName,
                target: material.target,
                current: 0
            }))
        };

        userData.subjects.push(subject);
        saveUserData();

        document.getElementById("subject-form").reset();
        pendingMaterials = [];
        renderPendingMaterials();
        renderApp();
        alert("科目建立成功！");
    });

    // 已建立的科目「分次追加 PDF」功能
    window.addMoreMaterialsToSubject = async function(subjectId, event) {
        const files = Array.from(event.target.files || []);
        if (files.length === 0) return;

        const subject = userData.subjects.find(s => s.id == subjectId);
        if (!subject) return;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
                alert(`${file.name} 不是 PDF 檔案`);
                continue;
            }
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const pageCount = pdf.numPages;
                subject.materials.push({
                    id: makeId(),
                    fileName: file.name,
                    target: pageCount,
                    current: 0
                });
                if (pdf.destroy) await pdf.destroy();
            } catch (error) {
                console.error(error);
                alert(`無法讀取：${file.name}`);
            }
        }

        saveUserData();
        renderApp();
        event.target.value = ""; // 清空 input 讓同一個檔案可以重複選取
        alert("成功追加新教材！");
    };

    // 刪除科目
    window.deleteSubject = function(subjectId) {
        const subject = userData.subjects.find(s => s.id == subjectId);
        if (!subject) return;
        if (!confirm(`確定要刪除「${subject.name}」嗎？\n\n該科目的教材與讀書紀錄也會被刪除。`)) return;

        userData.subjects = userData.subjects.filter(s => s.id != subjectId);
        userData.schedules = userData.schedules.filter(s => s.subjectId != subjectId);
        saveUserData();
        renderApp();
    };

    // 刪除教材
    window.deleteMaterial = function(subjectId, materialId) {
        const subject = userData.subjects.find(s => s.id == subjectId);
        if (!subject) return;
        if (!confirm("確定要刪除此教材嗎？")) return;

        subject.materials = subject.materials.filter(m => m.id != materialId);
        saveUserData();
        renderApp();
    };

    // 刪除讀書紀錄
    window.deleteSchedule = function(scheduleId) {
        if (!confirm("確定要刪除這筆讀書紀錄嗎？")) return;
        userData.schedules = userData.schedules.filter(s => s.id != scheduleId);
        saveUserData();
        renderApp();
    };

    // 排程聯動選單邏輯
    const scheduleSubjectSelect = document.getElementById("schedule-subject");
    const scheduleMaterialSelect = document.getElementById("schedule-material");
    const readingInfo = document.getElementById("reading-info");

    scheduleSubjectSelect.addEventListener("change", () => {
        const subjectId = scheduleSubjectSelect.value;
        scheduleMaterialSelect.innerHTML = '<option value="">請選擇教材</option>';
        readingInfo.classList.add("hidden");

        if (!subjectId) return;
        const subject = userData.subjects.find(s => s.id == subjectId);
        if (subject && subject.materials) {
            subject.materials.forEach(m => {
                const opt = document.createElement("option");
                opt.value = m.id;
                opt.textContent = `${m.fileName} (已讀 ${m.current}/${m.target} 頁)`;
                scheduleMaterialSelect.appendChild(opt);
            });
        }
    });

    scheduleMaterialSelect.addEventListener("change", () => {
        const subjectId = scheduleSubjectSelect.value;
        const materialId = scheduleMaterialSelect.value;
        if (!subjectId || !materialId) {
            readingInfo.classList.add("hidden");
            return;
        }
        const subject = userData.subjects.find(s => s.id == subjectId);
        const material = subject?.materials.find(m => m.id == materialId);
        if (material) {
            readingInfo.classList.remove("hidden");
            readingInfo.innerHTML = `目前進度：已讀 ${material.current} 頁 / 共 ${material.target} 頁`;
            document.getElementById("start-page").value = material.current + 1;
        }
    });

    // 計算本次閱讀頁數
    const startPageInput = document.getElementById("start-page");
    const endPageInput = document.getElementById("end-page");
    const readingCountDiv = document.getElementById("reading-count");
    const readingCountNumber = document.getElementById("reading-count-number");

    function updateReadingCount() {
        const start = parseInt(startPageInput.value) || 0;
        const end = parseInt(endPageInput.value) || 0;
        if (end >= start && start > 0) {
            const count = end - start + 1;
            readingCountDiv.classList.remove("hidden");
            readingCountNumber.textContent = `${count} 頁`;
        } else {
            readingCountDiv.classList.add("hidden");
        }
    }
    startPageInput.addEventListener("input", updateReadingCount);
    endPageInput.addEventListener("input", updateReadingCount);

    // 儲存讀書紀錄表單
    document.getElementById("schedule-form").addEventListener("submit", event => {
        event.preventDefault();
        if (!currentUser) { alert("請先進行 Google 登入"); return; }
        const date = document.getElementById("schedule-date").value;
        const time = document.getElementById("schedule-time").value;
        const subjectId = scheduleSubjectSelect.value;
        const materialId = scheduleMaterialSelect.value;
        const startPage = parseInt(startPageInput.value);
        const endPage = parseInt(endPageInput.value);

        const subject = userData.subjects.find(s => s.id == subjectId);
        const material = subject?.materials.find(m => m.id == materialId);

        if (!subject || !material) { alert("請選擇正確的科目與教材"); return; }
        if (endPage < startPage) { alert("結束頁不能小於開始頁"); return; }

        const pagesRead = endPage - startPage + 1;
        material.current = Math.max(material.current, endPage);

        const schedule = {
            id: makeId(),
            date,
            time,
            subjectId,
            subjectName: subject.name,
            materialId,
            fileName: material.fileName,
            startPage,
            endPage,
            pagesRead
        };

        userData.schedules.push(schedule);
        saveUserData();

        document.getElementById("schedule-form").reset();
        readingInfo.classList.add("hidden");
        readingCountDiv.classList.add("hidden");
        scheduleMaterialSelect.innerHTML = '<option value="">請先選擇科目</option>';
        renderApp();
        alert("讀書紀錄儲存成功！");
    });

    // 計時器邏輯
    let timerInterval = null;
    let secondsElapsed = 0;
    const timerDisplay = document.getElementById("timer-display");
    const timerStatus = document.getElementById("timer-status");
    const timerStartBtn = document.getElementById("timer-start");
    const timerStopBtn = document.getElementById("timer-stop");
    const timerSubjectSelect = document.getElementById("timer-subject");

    function formatTime(totalSeconds) {
        const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        return `${hrs}:${mins}:${secs}`;
    }

    timerStartBtn.addEventListener("click", () => {
        const subId = timerSubjectSelect.value;
        if (!subId) { alert("請先選擇計時的科目"); return; }
        timerStartBtn.classList.add("hidden");
        timerStopBtn.classList.remove("hidden");
        timerSubjectSelect.disabled = true;
        timerStatus.textContent = "計時中...";

        timerInterval = setInterval(() => {
            secondsElapsed++;
            timerDisplay.textContent = formatTime(secondsElapsed);
        }, 1000);
    });

    timerStopBtn.addEventListener("click", () => {
        clearInterval(timerInterval);
        timerStartBtn.classList.remove("hidden");
        timerStopBtn.classList.add("hidden");
        timerSubjectSelect.disabled = false;
        timerStatus.textContent = `上次計時結束，共計 ${formatTime(secondsElapsed)}`;
        secondsElapsed = 0;
        timerDisplay.textContent = "00:00:00";
    });

    // CSV 匯出功能
    document.getElementById("export-csv").addEventListener("click", () => {
        if (userData.schedules.length === 0) { alert("目前沒有讀書紀錄可匯出"); return; }
        let csvContent = "\uFEFF日期,時間,科目,教材,開始頁,結束頁,頁數\n";
        userData.schedules.forEach(s => {
            csvContent += `${s.date},${s.time || ''},"${s.subjectName}","${s.fileName}",${s.startPage},${s.endPage},${s.pagesRead}\n`;
        });
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `讀書紀錄_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    });

    // 渲染畫面總入口
    function renderApp() {
        timerSubjectSelect.innerHTML = '<option value="">請選擇科目</option>';
        scheduleSubjectSelect.innerHTML = '<option value="">請選擇科目</option>';
        userData.subjects.forEach(s => {
            const opt1 = document.createElement("option");
            opt1.value = s.id;
            opt1.textContent = s.name;
            timerSubjectSelect.appendChild(opt1);

            const opt2 = document.createElement("option");
            opt2.value = s.id;
            opt2.textContent = s.name;
            scheduleSubjectSelect.appendChild(opt2);
        });

        let totalSubjects = userData.subjects.length;
        let completedPages = 0;
        let totalPages = 0;

        userData.subjects.forEach(s => {
            if (s.materials) {
                s.materials.forEach(m => {
                    completedPages += Number(m.current) || 0;
                    totalPages += Number(m.target) || 0;
                });
            }
        });

        let avgProgress = totalPages > 0 ? Math.round((completedPages / totalPages) * 100) : 0;

        document.getElementById("kpi-total-subjects").textContent = totalSubjects;
        document.getElementById("kpi-completed-pages-number").textContent = completedPages;
        document.getElementById("kpi-avg-progress").textContent = `${avgProgress}%`;

        const subjectListEl = document.getElementById("subject-list");
        if (userData.subjects.length === 0) {
            subjectListEl.innerHTML = `<div class="text-center text-gray-400 py-8">尚未建立科目</div>`;
        } else {
            subjectListEl.innerHTML = userData.subjects.map(s => {
                let sTotal = 0, sCurrent = 0;
                if (s.materials) {
                    s.materials.forEach(m => {
                        sTotal += m.target;
                        sCurrent += m.current;
                    });
                }
                let sProgress = sTotal > 0 ? Math.round((sCurrent / sTotal) * 100) : 0;

                return `
                    <div class="border rounded-xl p-4 bg-white space-y-3">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-base">${escapeHtml(s.name)}</h3>
                                ${s.examDate ? `<div class="text-xs text-gray-500 mt-0.5"><i class="fa-solid fa-calendar mr-1"></i>考試日期：${s.examDate}</div>` : ''}
                            </div>
                            <button onclick="deleteSubject('${s.id}')" class="text-gray-400 hover:text-red-600 text-sm">
                                <i class="fa-solid fa-trash"></i> 刪除科目
                            </button>
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs text-gray-500">
                                <span>進度：${sCurrent}/${sTotal} 頁</span>
                                <span>${sProgress}%</span>
                            </div>
                            <div class="progress-bg">
                                <div class="progress-bar" style="width: ${sProgress}%"></div>
                            </div>
                        </div>
                        <div class="border-t pt-3 space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-medium text-gray-600">教材清單：</span>
                                <label class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded-md cursor-pointer">
                                    <i class="fa-solid fa-plus mr-1"></i>加PDF
                                    <input type="file" accept=".pdf,application/pdf" multiple class="hidden" onchange="addMoreMaterialsToSubject('${s.id}', event)">
                                </label>
                            </div>
                            ${(!s.materials || s.materials.length === 0) ? `<div class="text-xs text-gray-400 py-1">尚未加入 PDF 教材</div>` : ''}
                            ${(s.materials || []).map(m => {
                                return `
                                    <div class="flex items-center justify-between text-xs bg-gray-50 p-2 rounded-lg">
                                        <div class="truncate mr-2">
                                            <i class="fa-solid fa-file-pdf mr-1 text-red-500"></i> ${escapeHtml(m.fileName)} (${m.current}/${m.target}頁)
                                        </div>
                                        <button onclick="deleteMaterial('${s.id}', '${m.id}')" class="text-gray-400 hover:text-red-600">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    </div>
                                `;
                            }).join("")}
                        </div>
                    </div>
                `;
            }).join("");
        }

        const scheduleListEl = document.getElementById("schedule-list");
        if (userData.schedules.length === 0) {
            scheduleListEl.innerHTML = `<tr><td colspan="6" class="text-center text-gray-400 py-6">尚未有讀書紀錄</td></tr>`;
        } else {
            const sortedSchedules = [...userData.schedules].sort((a, b) => new Date(b.date) - new Date(a.date));
            scheduleListEl.innerHTML = sortedSchedules.map(sch => `
                <tr class="border-b">
                    <td class="py-3 pr-4">${sch.date} ${sch.time ? '<br><span class="text-xs text-gray-450">' + sch.time + '</span>' : ''}</td>
                    <td class="py-3 pr-4 font-medium">${escapeHtml(sch.subjectName)}</td>
                    <td class="py-3 pr-4 text-gray-600">${escapeHtml(sch.fileName)}</td>
                    <td class="py-3 pr-4">${sch.startPage} ~ ${sch.endPage} 頁</td>
                    <td class="py-3 pr-4 font-semibold">${sch.pagesRead} 頁</td>
                    <td class="py-3">
                        <button onclick="deleteSchedule('${sch.id}')" class="text-gray-400 hover:text-red-600">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join("");
        }
    }
</script>
</body>
</html>
