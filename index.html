<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端多人版 - 智慧讀書排程與多檔分析器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js 用於自動解析 PDF 頁數 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- 頁首控制列 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> 雲端智慧讀書規劃器
            </h1>
            <div id="auth-section" class="flex items-center gap-4">
                <span id="user-info" class="text-sm text-slate-600 hidden"></span>
                <button id="login-btn" onclick="loginWithGoogle()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-brands fa-google"></i> Google 登入
                </button>
                <button id="logout-btn" onclick="logout()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    登出
                </button>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- 未登入提示 -->
        <div id="login-prompt" class="bg-indigo-50 border border-indigo-100 rounded-2xl p-8 text-center my-12">
            <i class="fa-solid fa-lock text-4xl text-indigo-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">請先登入以開始使用</h2>
            <p class="text-slate-600 mb-6">登入後即可在雲端同步你的讀書進度、考試倒數與專屬檔案！</p>
            <button onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-medium shadow-md transition inline-flex items-center gap-2">
                <i class="fa-brands fa-google"></i> 使用 Google 帳號立即登入
            </button>
        </div>

        <!-- 登入後顯示的主內容 -->
        <div id="app-content" class="hidden space-y-6">
            
            <!-- KPI 儀表板 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-slate-500 font-medium">總科目數</p>
                        <h3 id="kpi-total-subjects" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600 text-xl"><i class="fa-solid fa-book"></i></div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-slate-500 font-medium">已完成總頁數</p>
                        <h3 id="kpi-completed-pages" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600 text-xl"><i class="fa-solid fa-check-double"></i></div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-slate-500 font-medium">整體平均進度</p>
                        <h3 id="kpi-avg-progress" class="text-2xl font-bold text-blue-600 mt-1">0%</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600 text-xl"><i class="fa-solid fa-chart-pie"></i></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 左側：科目與檔案管理 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-600"></i> 新增科目與考試設定
                    </h2>
                    <form id="subject-form" onsubmit="addSubject(event)" class="space-y-3">
                        <input type="text" id="sub-name" placeholder="科目名稱 (例如：有機化學)" required class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        
                        <div class="flex gap-2">
                            <div class="w-1/2">
                                <label class="text-xs text-slate-500 block mb-1">目標頁數 (選填)</label>
                                <input type="number" id="sub-target" placeholder="若有匯入檔可不填" min="1" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div class="w-1/2">
                                <label class="text-xs text-slate-500 block mb-1">考試日期</label>
                                <input type="date" id="sub-exam-date" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-slate-500 block mb-1">匯入參考檔案 (可多選 PDF/圖片，自動計算頁數)</label>
                            <input type="file" id="sub-files" multiple accept=".pdf,.txt" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-150 cursor-pointer">
                        </div>

                        <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-2.5 rounded-xl text-sm font-medium transition">建立科目與任務</button>
                    </form>

                    <hr class="border-slate-100 my-4">

                    <h3 class="text-sm font-bold text-slate-700">讀書清單與進度勾選</h3>
                    <div id="subject-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-1">
                        <!-- 動態插入科目 -->
                    </div>
                </div>

                <!-- 右側：排程與工具 -->
                <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-calendar-days text-indigo-600"></i> 本週讀書排程表
                        </h2>
                        <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">
                            <i class="fa-solid fa-download"></i> 匯出 CSV
                        </button>
                    </div>
                    <!-- 排程表格 -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b text-xs text-slate-400 uppercase">
                                    <th class="py-2 px-3">星期</th>
                                    <th class="py-2 px-3">時段分配</th>
                                    <th class="py-2 px-3">預計科目</th>
                                </tr>
                            </thead>
                            <tbody id="schedule-table-body" class="text-sm divide-y">
                                <!-- 動態排程 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK 引入與邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBv8wQy6iQdyp3TBDXzv5ZPJWsT3PYIXk",
            authDomain: "study-scheduler-21d31.firebaseapp.com",
            projectId: "study-scheduler-21d31",
            storageBucket: "study-scheduler-21d31.firebasestorage.app",
            messagingSenderId: "397621309129",
            appId: "1:397621309129:web:8c2893f7bac4429ff7e718",
            measurementId: "G-LSC7WV46Y9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        auth.useDeviceLanguage();
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let userData = { subjects: [], schedule: {} };

        onAuthStateChanged(auth, async (user) => {
            const loginPrompt = document.getElementById('login-prompt');
            const appContent = document.getElementById('app-content');
            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');

            if (user) {
                currentUser = user;
                loginPrompt.classList.add('hidden');
                appContent.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                userInfo.textContent = `Hi, ${user.displayName || user.email}`;
                userInfo.classList.remove('hidden');
                await loadUserData();
            } else {
                currentUser = null;
                loginPrompt.classList.remove('hidden');
                appContent.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                userInfo.classList.add('hidden');
            }
        });

        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("登入失敗：", error);
                alert("登入失敗：" + error.message);
            }
        };

        window.logout = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("登出失敗：", error);
            }
        };

        async function loadUserData() {
            if (!currentUser) return;
            const docRef = doc(db, "schedules", currentUser.uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                userData = docSnap.data();
            } else {
                userData = {
                    subjects: [
                        { id: 1, name: "範例：微積分", target: 120, current: 40, examDate: "2026-06-15", files: [] }
                    ],
                    schedule: {}
                };
                await saveUserData();
            }
            renderApp();
        }

        async function saveUserData() {
            if (!currentUser) return;
            const docRef = doc(db, "schedules", currentUser.uid);
            await setDoc(docRef, userData);
        }

        // 自動解析 PDF 頁數與檔名
        async function parseFiles(fileList) {
            let filesData = [];
            let extraPages = 0;
            for (let file of fileList) {
                let pageCount = 1; // 預設非PDF檔為1頁
                if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        pageCount = pdf.numPages;
                    } catch (e) {
                        console.error("PDF 解析失敗", e);
                    }
                }
                filesData.push({ name: file.name, pages: pageCount });
                extraPages += pageCount;
            }
            return { filesData, extraPages };
        }

        window.addSubject = async function(e) {
            e.preventDefault();
            const name = document.getElementById('sub-name').value;
            let targetInput = document.getElementById('sub-target').value;
            let target = targetInput ? parseInt(targetInput) : 0;
            const examDate = document.getElementById('sub-exam-date').value;
            const fileInput = document.getElementById('sub-files');

            let files = [];
            if (fileInput.files.length > 0) {
                const parsed = await parseFiles(fileInput.files);
                files = parsed.filesData;
                // 如果沒有填寫目標總頁數，直接用解析出來的檔案總頁數！
                if (!targetInput) {
                    target = parsed.extraPages;
                }
            }

            if (target <= 0) {
                alert("請至少輸入目標頁數，或上傳能自動解析頁數的 PDF 檔案！");
                return;
            }

            userData.subjects.push({
                id: Date.now(),
                name,
                target,
                current: 0,
                examDate,
                files
            });

            document.getElementById('subject-form').reset();
            await saveUserData();
            renderApp();
        }

        window.updateProgressDirect = async function(id, val) {
            const sub = userData.subjects.find(s => s.id === id);
            if (sub) {
                sub.current = Math.max(0, Math.min(sub.target, parseInt(val) || 0));
                await saveUserData();
                renderApp();
            }
        }

        window.updateProgress = async function(id, delta) {
            const sub = userData.subjects.find(s => s.id === id);
            if (sub) {
                sub.current = Math.max(0, Math.min(sub.target, sub.current + delta));
                await saveUserData();
                renderApp();
            }
        }

        window.deleteSubject = async function(id) {
            userData.subjects = userData.subjects.filter(s => s.id !== id);
            await saveUserData();
            renderApp();
        }

        function calculateCountdown(examDate) {
            if (!examDate) return null;
            const now = new Date();
            const exam = new Date(examDate);
            const diffTime = exam - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return "已過期";
            if (diffDays === 0) return "就是今天！";
            return `倒數 ${diffDays} 天`;
        }

        function renderApp() {
            const totalSub = userData.subjects.length;
            const totalPages = userData.subjects.reduce((sum, s) => sum + s.current, 0);
            const totalTarget = userData.subjects.reduce((sum, s) => sum + s.target, 0);
            const avgProg = totalTarget > 0 ? Math.round((totalPages / totalTarget) * 100) : 0;

            document.getElementById('kpi-total-subjects').textContent = totalSub;
            document.getElementById('kpi-completed-pages').textContent = totalPages;
            document.getElementById('kpi-avg-progress').textContent = avgProg + '%';

            const listEl = document.getElementById('subject-list');
            listEl.innerHTML = userData.subjects.map(s => {
                const percent = s.target > 0 ? Math.round((s.current / s.target) * 100) : 0;
                const countdownText = calculateCountdown(s.examDate);
                
                let filesHtml = '';
                if (s.files && s.files.length > 0) {
                    filesHtml = `<div class="text-xs text-indigo-600 bg-indigo-50 p-2.5 rounded-xl space-y-1 border border-indigo-100">
                        <div class="font-bold flex items-center gap-1"><i class="fa-solid fa-paperclip"></i> 已匯入的檔案 (${s.files.length}個)：</div>
                        ${s.files.map(f => `<div class="truncate flex justify-between"><span>📄 ${f.name}</span> <span class="font-semibold text-indigo-700">${f.pages}頁</span></div>`).join('')}
                    </div>`;
                }

                return `
                    <div class="p-4 bg-slate-50 rounded-2xl space-y-3 border border-slate-100">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold text-slate-800 text-base">${s.name}</h4>
                                ${countdownText ? `<span class="inline-block px-2 py-0.5 bg-amber-50 text-amber-600 text-xs font-semibold rounded-full mt-1"><i class="fa-solid fa-clock"></i> ${countdownText} (${s.examDate})</span>` : ''}
                            </div>
                            <button onclick="deleteSubject(${s.id})" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                        </div>

                        ${filesHtml}

                        <div class="space-y-1">
                            <div class="flex justify-between text-xs text-slate-500">
                                <span>讀書進度條</span>
                                <span class="font-bold text-slate-700">${s.current} / ${s.target} 頁 (${percent}%)</span>
                            </div>
                            <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${percent}%"></div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 pt-1">
                            <span class="text-xs text-slate-500 whitespace-nowrap">讀到第幾頁：</span>
                            <input type="number" value="${s.current}" min="0" max="${s.target}" onchange="updateProgressDirect(${s.id}, this.value)" class="w-20 px-2 py-1 text-xs border rounded-lg bg-white font-medium text-center focus:ring-2 focus:ring-indigo-500 outline-none">
                            <div class="flex gap-1 ml-auto">
                                <button onclick="updateProgress(${s.id}, 5)" class="bg-white border hover:bg-slate-100 text-xs px-2 py-1 rounded shadow-sm">+5</button>
                                <button onclick="updateProgress(${s.id}, 10)" class="bg-white border hover:bg-slate-100 text-xs px-2 py-1 rounded shadow-sm">+10</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const days = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
            const tbody = document.getElementById('schedule-table-body');
            tbody.innerHTML = days.map((day, idx) => {
                const assignedSub = userData.subjects.length > 0 ? userData.subjects[idx % userData.subjects.length].name : "尚未新增科目";
                return `
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 px-3 font-medium text-slate-700">${day}</td>
                        <td class="py-3 px-3 text-slate-500">19:00 - 21:00 (2小時)</td>
                        <td class="py-3 px-3 font-semibold text-indigo-600">${assignedSub}</td>
                    </tr>
                `;
            }).join('');
        }

        window.exportCSV = function() {
            let csv = '\uFEFF科目,考試日期,目標頁數,已讀頁數,進度百分比\n';
            userData.subjects.forEach(s => {
                const percent = s.target > 0 ? Math.round((s.current / s.target) * 100) : 0;
                csv += `${s.name},${s.examDate || '無'},${s.target},${s.current},${percent}%\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'study_progress_report.csv';
            a.click();
        }
    </script>
</body>
</html>
